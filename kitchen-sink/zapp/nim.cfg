# Editor/LSP config for the Nim app entry (app.nim). Lets nimsuggest /
# nimlangserver resolve `import zapp` — plus zapp.nim's transitive framework
# imports and the CLI-generated `.zapp/` modules (zapp_build_config, etc.) — the
# same --path values `zapp build` passes on the command line. The build does NOT
# need this file (it passes --path explicitly); it's purely for editor tooling.
# The `.zapp/` modules exist after your first `bun run build`/`dev`.
--path:"../../native/nim"
--path:"../.zapp"
